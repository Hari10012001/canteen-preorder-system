spring.application.name=kiot-canteen
server.port=8080

# ---------------- MySQL ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/kiot_canteen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ---------------- Demo canteen configuration ----------------
kiot.canteen.name=KIOT Canteen
kiot.canteen.open=07:00
kiot.canteen.close=19:00
kiot.canteen.max-advance-days=7

# Static resources
spring.web.resources.cache.period=0
spring.mvc.static-path-pattern=/**